name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint • types • tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Manim needs these system libs to import/render (cairo, pango, ffmpeg).
      - name: Install system deps for manim
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check backend tests

      - name: Ruff format check
        run: uv run ruff format --check backend tests

      - name: Pyright
        # Non-blocking until the existing code is fully annotated. Remove
        # continue-on-error to enforce types once `make typecheck` is clean.
        continue-on-error: true
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  frontend:
    name: biome (board/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Biome check
        run: npx --yes @biomejs/biome ci board
