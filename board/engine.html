<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manim Animator — Live Board</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 20px;
      }
      h1 {
        font-size: 16px;
        font-weight: 700;
        color: #8b949e;
        margin: 0;
        letter-spacing: 0.06em;
      }
      .bar {
        display: flex;
        gap: 8px;
        width: 920px;
        max-width: 96vw;
      }
      input {
        flex: 1;
        background: #161b22;
        border: 1px solid #30363d;
        color: #e6edf3;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 15px;
      }
      button {
        background: #238636;
        border: 0;
        color: #fff;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .modes {
        display: flex;
        gap: 6px;
        width: 920px;
        max-width: 96vw;
      }
      .mode {
        background: #161b22;
        border: 1px solid #30363d;
        color: #8b949e;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        text-transform: capitalize;
      }
      .mode.active {
        background: #1f6feb22;
        border-color: #1f6feb;
        color: #e6edf3;
      }
      #board {
        width: 920px;
        max-width: 96vw;
        border: 1px solid #30363d;
        border-radius: 12px;
        background: #0d1117;
      }
      #board.cartoon {
        background: #eaf3fb;
        border-color: #c7d6e6;
      }
      /* Ambient idle motion for cartoon drawables (life in the frame). */
      @keyframes amb-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes amb-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-9px);
        }
      }
      @keyframes amb-sway {
        0%,
        100% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }
      @keyframes amb-rise {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
      @keyframes amb-fall {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(7px);
        }
      }
      @keyframes amb-flow {
        0%,
        100% {
          transform: translateX(-4px);
        }
        50% {
          transform: translateX(4px);
        }
      }
      @keyframes amb-glow {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.06);
          opacity: 0.88;
        }
      }
      @keyframes act-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.18);
        }
      }
      @keyframes act-point {
        0%,
        100% {
          transform: rotate(0) scale(1);
        }
        45% {
          transform: rotate(-7deg) scale(1.06);
        }
      }
      @keyframes act-wobble {
        0%,
        100% {
          transform: rotate(-4deg);
        }
        50% {
          transform: rotate(4deg);
        }
      }
      /* The subject ACTS the process — motion must read across the board, not nudge. The board
         is ~525 units tall, so travel is in the 150–220 range (≈30–42% of height), not tens. */
      @keyframes act-rise {
        from {
          transform: translateY(0);
          opacity: 1;
        }
        to {
          transform: translateY(-200px);
          opacity: 0.08;
        }
      }
      @keyframes act-fall {
        0% {
          transform: translateY(-180px);
          opacity: 0.15;
        }
        70% {
          transform: translateY(16px);
          opacity: 1;
        }
        100% {
          transform: translateY(0);
        }
      }
      /* flow = water/air TRAVELS along a current (a drift-and-settle sweep), not a rotate-wobble */
      @keyframes act-flow {
        0% {
          transform: translateX(0);
        }
        30% {
          transform: translateX(70px) translateY(-8px);
        }
        65% {
          transform: translateX(-50px) translateY(6px);
        }
        100% {
          transform: translateX(0);
        }
      }
      /* transform = a change of STATE (vapor→cloud): collapse, then re-form larger and settle */
      @keyframes act-transform {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        32% {
          transform: scale(0.5) rotate(-6deg);
          opacity: 0.4;
        }
        68% {
          transform: scale(1.22) rotate(3deg);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes act-grow {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.55);
        }
      }
      @keyframes act-shrink {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(0.82);
        }
      }
      @keyframes act-exit {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
          transform: scale(0.8);
        }
      }
      #caption {
        min-height: 24px;
        font-size: 17px;
        color: #c9d1d9;
        text-align: center;
        max-width: 920px;
      }
      #status {
        width: 920px;
        max-width: 96vw;
        font-size: 12.5px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tag {
        padding: 2px 8px;
        border-radius: 6px;
        background: #21262d;
        color: #c9d1d9;
      }
      .tag.warn {
        background: #5a3a1a;
        color: #ffd9a8;
      }
      .tag.ok {
        background: #1f6f3f;
        color: #d2f5dd;
      }
      #provenance {
        width: 920px;
        max-width: 96vw;
        font-size: 13px;
        color: #8b949e;
        min-height: 18px;
      }
      a.legacy {
        color: #484f58;
        font-size: 12px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>MANIM ANIMATOR · LIVE BOARD</h1>
    <div id="status"></div>
    <div class="modes" id="modes">
      <button class="mode active" data-mode="learn">learn</button>
      <button class="mode" data-mode="story">story</button>
      <button class="mode" data-mode="draw">draw</button>
      <button class="mode" data-mode="explain">explain</button>
    </div>
    <div class="modes" id="audiences">
      <button class="mode aud" data-aud="child">kid</button>
      <button class="mode aud active" data-aud="general">general</button>
      <button class="mode aud" data-aud="expert">expert</button>
    </div>
    <div class="modes" id="styles">
      <button class="mode active" data-style="cartoon">cartoon</button>
      <button class="mode" data-style="whiteboard">whiteboard</button>
    </div>
    <div class="bar">
      <input id="topic" value="the water cycle" placeholder="Type a topic…" />
      <button id="go">Teach</button>
    </div>
    <svg
      id="board"
      viewBox="0 0 920 526"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Animated lesson board"
    ></svg>
    <div id="provenance"></div>
    <div id="caption"></div>
    <a class="legacy" href="/legacy">v2 board (legacy)</a>
    <script src="/board/engine.js"></script>
  </body>
</html>
