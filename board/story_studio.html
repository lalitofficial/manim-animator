<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Story Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --line: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --good: #238636;
        --warn: #d29922;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 22px 0 36px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      a {
        color: #9ecbff;
        text-decoration: none;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }
      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      textarea,
      select {
        width: 100%;
        background: #0d1117;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 10px;
        font: inherit;
      }
      textarea {
        min-height: 80px;
        resize: vertical;
      }
      button {
        background: var(--good);
        border: 0;
        color: white;
        border-radius: 6px;
        padding: 12px 18px;
        font-weight: 800;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .selects {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
        gap: 14px;
        margin-top: 14px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
      h2,
      h3 {
        margin: 0 0 10px;
      }
      .muted {
        color: var(--muted);
      }
      #story {
        white-space: pre-wrap;
        line-height: 1.65;
        font-size: 17px;
      }
      .scene {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 12px;
      }
      .score {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid #222933;
      }
      .pill {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 999px;
        background: #1f6feb22;
        color: #9ecbff;
        font-size: 12px;
        font-weight: 700;
      }
      .warning {
        color: #ffd8a8;
      }
      .feedback {
        border-top: 1px solid var(--line);
        margin-top: 18px;
        padding-top: 14px;
        display: grid;
        gap: 10px;
      }
      .feedback textarea {
        min-height: 64px;
      }
      @media (max-width: 860px) {
        .controls,
        .grid,
        .selects {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Story Studio</h1>
          <div class="muted">
            Text-first story lab. Template is the fast feedback loop; auto/Ollama are experiments.
          </div>
        </div>
        <a href="/engine">Open Board</a>
      </header>

      <div class="controls">
        <div>
          <label style="margin-bottom: 10px">
            Benchmark Prompt
            <select id="exampleSelect">
              <option value="">custom prompt</option>
            </select>
          </label>
          <label>
            Prompt
            <textarea id="prompt">Tenali Rama solves a funny problem in the royal court</textarea>
          </label>
          <div class="selects">
            <label>
              Arc
              <select id="arc">
                <option value="explainer">explainer</option>
                <option value="folk_tale" selected>folk tale</option>
                <option value="adventure">adventure</option>
                <option value="mystery">mystery</option>
                <option value="comedy">comedy</option>
              </select>
            </label>
            <label>
              Audience
              <select id="audience">
                <option value="child">child</option>
                <option value="general" selected>general</option>
                <option value="expert">expert</option>
              </select>
            </label>
            <label>
              Tone
              <select id="tone">
                <option value="warm" selected>warm</option>
                <option value="playful">playful</option>
                <option value="dramatic">dramatic</option>
                <option value="formal">formal</option>
              </select>
            </label>
            <label>
              Length
              <select id="length">
                <option value="short" selected>short</option>
                <option value="medium">medium</option>
                <option value="long">long</option>
              </select>
            </label>
            <label>
              Provider
              <select id="providerSelect">
                <option value="template" selected>template</option>
                <option value="auto">auto</option>
                <option value="ollama">ollama</option>
                <option value="vertex">vertex</option>
              </select>
            </label>
          </div>
        </div>
        <button id="generate">Generate</button>
      </div>

      <div class="grid">
        <section>
          <h2 id="title">Ready</h2>
          <p id="logline" class="muted">Generate a story package to begin.</p>
          <h3>Story Promise</h3>
          <p id="promise" class="muted"></p>
          <h3>Character Arc</h3>
          <div id="characterArc"></div>
          <h3>Draft</h3>
          <div id="story"></div>
          <div class="feedback">
            <label>
              Rating
              <select id="rating">
                <option value="">unrated</option>
                <option value="5">5 - strong</option>
                <option value="4">4 - usable</option>
                <option value="3">3 - needs revision</option>
                <option value="2">2 - weak</option>
                <option value="1">1 - reject</option>
              </select>
            </label>
            <label>
              Notes
              <textarea id="note" placeholder="What worked? What failed?"></textarea>
            </label>
            <button id="save" disabled>Save Feedback</button>
            <div id="saveStatus" class="muted"></div>
          </div>
        </section>
        <aside>
          <section>
            <h3>Provenance</h3>
            <div id="providerInfo" class="muted"></div>
            <div id="warnings" class="warning"></div>
          </section>
          <section style="margin-top: 14px">
            <h3>Scores</h3>
            <div id="scores"></div>
          </section>
          <section style="margin-top: 14px">
            <h3>Critique</h3>
            <ul id="critique"></ul>
          </section>
          <section style="margin-top: 14px">
            <h3>Outline</h3>
            <div id="scenes"></div>
          </section>
        </aside>
      </div>
    </main>
    <script src="/board/story_studio.js"></script>
  </body>
</html>
